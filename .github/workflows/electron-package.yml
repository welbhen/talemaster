name: Electron Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Windows x64 ZIP
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and package Electron application
        run: npx nx run electron:package

      - name: Verify ZIP package exists
        shell: pwsh
        run: |
          $archives = Get-ChildItem -Path "dist/apps/electron/out/make" -Filter "*.zip" -File -Recurse
          if (-not $archives) {
            throw "Electron Forge did not produce a ZIP package."
          }
          $archives | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: talemaster-windows-x64-${{ github.sha }}
          path: dist/apps/electron/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 14
