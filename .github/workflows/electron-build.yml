name: Electron Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build renderer and Electron application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular dashboard
        run: npx nx build dashboard --configuration=production

      - name: Build Electron main and preload
        run: npx nx run electron:build:production

      - name: Assemble desktop application
        run: npx nx run electron:assemble

      - name: Verify assembled application
        shell: bash
        run: |
          test -f dist/apps/electron/main.js
          test -f dist/apps/electron/preload.js
          test -f dist/apps/electron/dashboard/browser/index.html
          test -f dist/apps/electron/package.json

      - name: Upload assembled application
        uses: actions/upload-artifact@v7
        with:
          name: talemaster-electron-build-${{ github.sha }}
          path: dist/apps/electron/
          if-no-files-found: error
          retention-days: 7
